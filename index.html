<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage-grotesque-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#EEF5F5;--card:#fff;--ink:#12263A;--mut:#5B6F80;--line:#D3E0E2;--pri:#0E7C86;--onpri:#fff;--acc:#F2A93B;--ok:#2E9E6B;--bad:#D6453D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1822;--card:#142431;--ink:#E7F0F3;--mut:#93A8B5;--line:#244052;--pri:#2BB3BF;--onpri:#06222A;--acc:#F2B04F;--ok:#4CC38A;--bad:#F06B63}}
:root[data-theme="dark"]{--bg:#0C1822;--card:#142431;--ink:#E7F0F3;--mut:#93A8B5;--line:#244052;--pri:#2BB3BF;--onpri:#06222A;--acc:#F2B04F;--ok:#4CC38A;--bad:#F06B63}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;min-height:100%}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.date{color:var(--mut);font-size:14px;text-align:right}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.big{font-size:28px;font-weight:800}
.warn{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
form{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=text],input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;background:var(--pri);color:var(--onpri);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
form button{grid-column:1/-1}
.task{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.t{font-size:20px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.task.done .t,.task.done .n{color:var(--mut);text-decoration:line-through}
.task.late .t{color:var(--bad)}
.acts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts button{padding:8px 12px;font-size:14px}
.acts .ok{background:var(--ok);color:#fff}
.task img{grid-column:2;max-width:100%;max-height:200px;border-radius:12px;margin-top:6px}
.empty{color:var(--mut);padding:8px 0}
.week{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:10px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.week b{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px}
#ring{position:fixed;inset:0;background:rgba(8,20,28,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#ring.on{display:flex}
#ring .box{text-align:center;max-width:380px;width:100%;animation:sh .6s infinite}
@keyframes sh{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){#ring .box{animation:none}}
#ring h2{margin:6px 0 14px;font-size:26px}
#ring .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
h3{margin:0 0 6px;font-size:18px}

.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.nav .lab{flex:1;text-align:center;font-weight:800}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button,.seg button{background:transparent;color:var(--ink);border:1px solid var(--line);flex:1}
.tabs button.on,.seg button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.seg{display:flex;gap:6px;margin:6px 0 12px}
.gear{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 10px;font-size:18px;margin-left:8px}
.dh{font-weight:800;margin-top:10px;cursor:pointer;color:var(--pri)}
.wt{display:flex;gap:10px;padding:3px 0;font-size:15px}.wt.done{color:var(--mut);text-decoration:line-through}
form{grid-template-columns:1fr auto auto}form input[type=text]{grid-column:1/-1}
.tabs button{padding:10px 4px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;min-width:360px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:4px;text-align:left}.tbl td:first-child{color:var(--mut);width:28px}.tbl input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px}.tbl td:last-child{white-space:nowrap}.tbl button{padding:5px 9px;margin-left:3px}.tbl tr.done input.tt{text-decoration:line-through;color:var(--mut)}
#reg{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:20px 16px;z-index:8}
#reg.on{display:block}#reg .box{max-width:420px;margin:0 auto}
#regF{display:block}#regF input,#regF select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;margin:4px 0 12px}#regF button{width:100%;margin-top:6px}
#regF .lg{display:flex;gap:6px;margin-bottom:12px}#regF .lg button{margin:0;background:transparent;color:var(--ink);border:1px solid var(--line)}#regF .lg button.on{background:var(--pri);color:var(--onpri)}
#wrText{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);border-radius:12px;padding:12px;margin:8px 0}

try{tasks=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
try{set=Object.assign(set,JSON.parse(localStorage.getItem(KS)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(tasks))}catch(e){alert(T('full'))}gcPhotos();syncNative()};
// --- rasmlar IndexedDB'da (localStorage 5 MB chegarasi yo'q) ---
const PH={};let idb=null;
const photoSrc=t=>PH[t.id]||(t.photo&&t.photo.length>20?t.photo:'');
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('kunim',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function idbAll(db){return new Promise(res=>{const o={};if(!db)return res(o);try{const q=db.transaction('ph').objectStore('ph').openCursor();q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else res(o)};q.onerror=()=>res(o)}catch(e){res(o)}})}
function idbPut(k,v){try{if(!idb)return;const st=idb.transaction('ph','readwrite').objectStore('ph');v?st.put(v,String(k)):st.delete(String(k))}catch(e){}}
function gcPhotos(){try{const ids=new Set(tasks.map(t=>String(t.id)));Object.keys(PH).forEach(k=>{if(!ids.has(k)){delete PH[k];idbPut(k,null)}})}catch(e){}}
async function bootPhotos(){idb=await idbOpen();if(!idb)return;
  const all=await idbAll(idb);Object.keys(all).forEach(k=>{PH[k]=all[k]});
  let mig=false;tasks.forEach(t=>{if(t.photo&&t.photo.length>20&&t.photo.startsWith('data:')){PH[t.id]=t.photo;idbPut(t.id,t.photo);t.photo='idb';mig=true}});
  if(mig)save();else gcPhotos()}
const saveSet=()=>{try{localStorage.setItem(KS,JSON.stringify(set))}catch(e){}syncNative()};

function weeklyText(){
  const now=new Date(),tk=dkey(now),cur=hm(now),days=[...Array(7)].map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()-6+i);return d});
  let total=0,done=0,photo=0;const lines=[],left=[];
  days.forEach(d=>{const k=dkey(d),l=sorted(tasks.filter(t=>t.date===k&&(t.done||k<tk||t.time<=cur))),n=l.filter(t=>t.done).length;
    total+=l.length;done+=n;photo+=l.filter(t=>t.done&&t.photo).length;
    lines.push(L[set.lang].days[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+': '+(l.length?n+'/'+l.length:T('wrNone')));
    l.filter(t=>!t.done).forEach(t=>left.push('• '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+t.time+' '+t.title))});
  const head=[T('wrHead')];if(profile)head.push('👤 '+profile.name+' ('+cname(profile.country)+')');
  let out=[...head,'',T('wrDone')+': '+done+'/'+total+(total?' ('+Math.round(done/total*100)+'%)':''),T('wrPhoto')+': '+photo,'',...lines];
  if(left.length)out.push('',T('wrLeft')+':',...left.slice(0,10),...(left.length>10?['… +'+(left.length-10)]:[]));
  return out.join('\n')}

const KM='kunim.timer.v1';let tm={total:1500000,left:1500000,end:0,ended:false};

function renderTimer(){
  if(tm.end&&Date.now()>=tm.end){tm.ended=Date.now()-tm.end<=LATE_MS;tm.end=0;tm.left=tm.total;saveTm();keepAwake()}
  const sec=Math.ceil((tm.end?Math.max(0,tm.end-Date.now()):tm.left)/1000),h=Math.floor(sec/3600),x=(h?h+':':'')+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);
  $('tmShow').textContent=x;$('tmShow').classList.toggle('long',h>0);
  const paused=!tm.end&&tm.left<tm.total;
  $('tmGo').textContent=T(tm.end?'tmPause':paused?'tmResume':'tmStart');
  $('tmPre').style.visibility=$('tmCustom').style.visibility=tm.end||paused?'hidden':'visible'}
function setMinutes(m){tm.total=tm.left=m*60000;tm.end=0;saveTm();renderTimer()}

$('tmMin').onchange=e=>{e.target.value=tm.total/60000};
$('tmGo').onclick=()=>{unlock();if(tm.end){tm.left=Math.max(1000,tm.end-Date.now());tm.end=0}else{tm.end=Date.now()+tm.left}tm.ended=false;saveTm();renderTimer();keepAwake()};
$('tmReset').onclick=()=>{tm.end=0;tm.left=tm.total;tm.ended=false;saveTm();renderTimer();keepAwake()};

function addTask(){const t=$('title').value.trim();if(!t||!$('fdate').value||!$('time').value){(!t?$('title'):!$('fdate').value?$('fdate'):$('time')).focus();return}const fd=$('fdate').value;materialize(fd);ensureSlots(fd);if(tasks.filter(x=>x.date===fd).length>=20){alert(T('lim'));return}tasks.push({id:Date.now(),date:fd,time:$('time').value,title:t,done:false,fired:false,photo:'',slot:null});ensureSlots(fd);sel=fd;$('title').value='';save();render()}
let pend=null,pendDone=false;function askPhoto(t,d){if(ringId===t.id){clearInterval(beepT);ringStart=Date.now()}pend=t.id;pendDone=d;$('file').value='';$('file').click()}function complete(t){if(t.photo){t.done=true;if(ringId===t.id)stopRing();save();render()}else askPhoto(t,true)}
$('list').onchange=e=>{const r=e.target.closest('tr[data-s]');if(!r)return;
  if(r.dataset.g){const g=r.dataset.g,s=+r.dataset.s,tm=r.querySelector('.ti').value,ti=r.querySelector('.tt').value.trim();if(!tpl[g])tpl[g]=[];if(tm&&ti){tpl[g][s]={time:tm,title:ti};syncTpl(g,s)}else if(!tm&&!ti){tpl[g][s]=null;syncTpl(g,s)}return}const s=+r.dataset.s,tm=r.querySelector('.ti').value,ti=r.querySelector('.tt').value.trim(),t=tasks.find(x=>x.date===sel&&x.slot===s);
  if(tm&&ti){if(t){if(t.time!==tm)resetAlarm(t);t.time=tm;t.title=ti}else tasks.push({id:Date.now(),date:sel,time:tm,title:ti,done:false,fired:false,photo:'',slot:s});save();render()}

  const h=e.target.closest('.dh');if(h){sel=h.dataset.d;view='day';$('fdate').value=sel;render();return}

$('file').onchange=e=>{const f=e.target.files[0],t=find(pend);if(!f||!t)return;const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const s=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const du=c.toDataURL('image/jpeg',.7);PH[t.id]=du;if(idb){idbPut(t.id,du);t.photo='idb'}else t.photo=du;URL.revokeObjectURL(u);if(pendDone){t.done=true;pendDone=false;if(ringId===t.id)stopRing()}save();render()};img.src=u};

let lock=null,locking=false;
async function keepAwake(){try{
  if(!set.awake&&!tm.end){if(lock){const l=lock;lock=null;await l.release()}return}
  if(!lock&&!locking&&navigator.wakeLock&&document.visibilityState==='visible'){locking=true;lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}
}catch(e){}finally{locking=false}}
$('awake').onchange=e=>{set.awake=e.target.checked;saveSet();keepAwake()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();refreshNative();pollNative().then(tick,tick)}});
document.addEventListener('click',()=>{unlock();keepAwake();setTimeout(setupEnable,300)});
// --- Android (Capacitor): yopiq ilovada ham chalinadigan budilnik ---
var NATIVE=false,LN=null,KA=null,AP=null,nativeOk=false,syncT=null,syncBusy=false,syncAgain=false;
try{if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins.LocalNotifications){NATIVE=true;LN=Capacitor.Plugins.LocalNotifications;
  try{KA=Capacitor.registerPlugin('KunimAlarm')}catch(e){KA=null}
  try{AP=Capacitor.Plugins.App||null}catch(e){AP=null}}}catch(e){}
function syncNative(){if(!NATIVE)return;clearTimeout(syncT);syncT=setTimeout(doSync,400)}
const snzLabel=()=>set.lang==='en'?T('nSnz')+set.snooze+' min':set.lang==='ru'?T('nSnz')+'на '+set.snooze+' мин':set.snooze+T('nSnz');
async function doSync(){
  if(syncBusy){syncAgain=true;return}syncBusy=true;
  try{
    for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);materialize(dkey(d))}
    const now=Date.now(),hz=now+14*864e5;
    if(KA){
      // maxsus native budilnik (AlarmManager + uzoq signal + to'liq ekran)
      try{
        const alarms=[];
        tasks.filter(t=>!t.done).forEach(t=>{const at=dueAt(t);if(at>now&&at<hz&&alarms.length<300)alarms.push({id:'t'+t.id,at,time:t.time,title:t.title})});
        if(tm.end>now)alarms.push({id:'timer',at:tm.end,time:'⏱',title:T('tmEnd')});
        await KA.config({snooze:set.snooze,vol:set.vol,stopL:T('nStop'),openL:T('nOpen'),snoozeL:snzLabel()});
        await KA.schedule({alarms});
        try{const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))})}catch(e){}
        return;
      }catch(e){KA=null}
    }
    // zaxira: oddiy bildirishnomalar
    const pend=await LN.getPending();
    if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const base={channelId:'alarm',smallIcon:'ic_stat_kunim',iconColor:'#0E7C86'},list=[];let i=0;
    tasks.filter(t=>!t.done).forEach(t=>{const at=dueAt(t);if(at>now&&at<hz&&i<300)list.push({...base,id:100+i++,title:'⏰ '+t.time,body:t.title,schedule:{at:new Date(at),allowWhileIdle:true}})});
    if(tm.end>now)list.push({...base,id:1,title:'⏱ KUNIM',body:T('tmEnd'),schedule:{at:new Date(tm.end),allowWhileIdle:true}});
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;syncNative()}}
}
// native budilnik chalgan bo'lsa: ikki marta chalinmasligi uchun holatni olamiz
async function pollNative(){if(!KA)return;
  try{const r=await KA.popRung(),it=r.items||[];
    it.forEach(x=>{
      if(x.id==='timer'){tm.ended=false;if(tm.end&&Date.now()>=tm.end){tm.end=0;tm.left=tm.total}saveTm();return}
      const t=find(+String(x.id).slice(1));if(!t)return;
      if(x.until>Date.now()){t.snoozeUntil=x.until;t.fired=false}else t.fired=true});
    if(it.length){save();render()}
    const o=await KA.popLaunch();
    if(o&&o.id&&o.id!=='timer'&&ringId===null){const t=find(+String(o.id).slice(1));if(t&&!t.done){t.fired=true;startRing(t)}}
  }catch(e){}}
async function refreshNative(){if(!NATIVE)return;
  try{const r=await LN.checkPermissions();let ok=r.display==='granted';
    if(KA){const a=await KA.canExact(),b=await KA.canFullScreen();ok=ok&&a.value&&b.value}
    nativeOk=ok}catch(e){}
  setupEnable()}
async function nativeAsk(){
  try{await LN.requestPermissions();
    if(KA){const a=await KA.canExact();if(!a.value){await KA.openExactSettings();return}
      const b=await KA.canFullScreen();if(!b.value){await KA.openFullScreenSettings();return}}
    else{try{const x=await LN.checkExactNotificationSetting();if(x.exact_alarm==='denied')await LN.changeExactNotificationSetting()}catch(e){}}
  }catch(e){}
  refreshNative();syncNative()}
if(NATIVE){try{LN.createChannel({id:'alarm',name:'KUNIM budilnik',description:'Budilnik signallari',importance:5,visibility:1,sound:'alarm.wav',vibration:true})}catch(e){}
  refreshNative();syncNative();
  // Android "Orqaga" tugmasi
  try{if(AP)AP.addListener('backButton',()=>{
    if(ringId!==null)return;
    if($('reg').classList.contains('on')){if($('rCancel').style.display!=='none')$('reg').classList.remove('on');return}
    if($('set').style.display!=='none'){$('set').style.display='none';return}
    if($('timer').classList.contains('on')){document.querySelector('[data-win=plan]').click();return}
    if(view!=='table'){view='table';render();return}
    AP.minimizeApp()})}catch(e){}}
$('time').value=hm(new Date(Date.now()+3600000));$('fdate').value=sel;
(async()=>{try{await bootPhotos()}catch(e){}try{await pollNative()}catch(e){}
  applyLang();setupEnable();keepAwake();tick();if(!profile||!profile.tg)openReg();setInterval(tick,1000)})();
if(!NATIVE&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
