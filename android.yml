name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pip install pillow
      - run: npm ci
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: npx cap sync android

      # Agar GitHub Secrets'da KUNIM_KEYSTORE_BASE64 bo'lsa — imzolangan release, bo'lmasa — debug APK
      - name: Keystore tayyorlash
        id: sign
        env:
          KS: ${{ secrets.KUNIM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/kunim.jks"
            echo "KUNIM_KEYSTORE=$RUNNER_TEMP/kunim.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUNIM_KEYSTORE_BASE64 secret yo'q — faqat debug APK yig'iladi (README'ni o'qing)."
          fi

      - name: Build
        working-directory: android
        env:
          KUNIM_STORE_PASS: ${{ secrets.KUNIM_STORE_PASS }}
          KUNIM_KEY_ALIAS: ${{ secrets.KUNIM_KEY_ALIAS }}
          KUNIM_KEY_PASS: ${{ secrets.KUNIM_KEY_PASS }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Fayllarni yig'ish
        id: pack
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          mkdir out
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/KUNIM-v$VER.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "out/KUNIM-v$VER.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/KUNIM-v$VER-debug.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: KUNIM-apk
          path: out/*

      # "v1.1.0" kabi teg qo'yilsa — Releases bo'limiga ham chiqaradi
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "KUNIM $GITHUB_REF_NAME" --generate-notes
